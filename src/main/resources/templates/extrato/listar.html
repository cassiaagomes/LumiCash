<!DOCTYPE html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/layout :: ~{}}"
>
  <th:block th:fragment="pageStyles">
    <link th:href="@{/css/listar.css}" rel="stylesheet" />
  </th:block>

  <body>
    <div th:fragment="pageContent">
      <!-- Header com filtro de conta e datas -->
      <div
        class="header-table d-flex justify-content-between align-items-center mb-3"
      >
        <form
          class="d-flex align-items-center"
          th:action="@{/extrato}"
          method="post"
        >
          <div class="input-icon-wrapper me-2">
            <span class="input-icon"><i class="fa fa-list"></i></span>
            <select
              class="search-input form-select"
              name="contaId"
              id="contaId"
            >
              <option value="">Selecione uma conta:</option>
              <option
                th:each="conta : ${contasCorrentista}"
                th:value="${conta.id}"
                th:selected="${conta.id == contaSelecionadaId}"
                th:text="${conta.descricao}"
              ></option>
            </select>
          </div>

          <div class="input-icon-wrapper me-2">
            <span class="input-icon"><i class="fa fa-calendar"></i></span>
            <input
              class="search-input form-control"
              type="date"
              id="dataInicio"
              name="dataInicio"
              th:value="${dataInicio}"
            />
          </div>

          <div class="input-icon-wrapper me-2">
            <span class="input-icon"><i class="fa fa-calendar"></i></span>
            <input
              class="search-input form-control"
              type="date"
              id="dataFim"
              name="dataFim"
              th:value="${dataFim}"
            />
          </div>

          <button type="submit" class="cadastrar btn btn-primary">
            Pesquisar
          </button>
        </form>
      </div>

      <!-- Mensagens -->
      <div
        th:if="${contaSelecionadaId == null}"
        class="alert alert-info mb-3 text-center"
      >
        <i class="fas fa-info-circle"></i>
        Selecione uma conta acima para visualizar as transações.
      </div>

      <div
        th:if="${mensagem}"
        th:text="${mensagem}"
        class="text-danger mb-3 text-center"
      ></div>

      <!-- Tabela de transações -->
      <div class="table-wrapper" th:if="${contaSelecionadaId != null}">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Valor (R$)</th>
              <th>Categoria</th>
              <th>Comentário</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="transacao : ${transacoes}">
              <td
                th:text="${#temporals.format(transacao.data, 'dd/MM/yyyy')}"
              ></td>
              <td th:text="${transacao.descricao}"></td>
              <td
                th:text="${#numbers.formatDecimal(transacao.valor, 1, 'COMMA', 2, 'POINT')}"
              ></td>
              <td th:text="${transacao.categoria.nome}"></td>
              <td>
                <a
                  href="#"
                  th:if="${transacao.comentario != null}"
                  th:attr="data-comentario=${transacao.comentario.texto}"
                  class="abrirComentario"
                  data-bs-toggle="modal"
                  data-bs-target="#comentarioModal"
                >
                  Ver Comentário
                </a>
                <span th:if="${transacao.comentario == null}">-</span>
              </td>
              <td class="actions">
                <!-- <a
                  href="#"
                  class="btn-editar"
                  th:data-id="${transacao.id}"
                  title="Editar"
                >
                  <i class="fas fa-edit edit"></i>
                </a>
                <a
                  href="#"
                  class="btn-comentario"
                  th:data-id="${transacao.id}"
                  title="Adicionar Comentário"
                >
                  <i class="fas fa-comment comment"></i>
                </a> -->
                <a
                  href="#"
                  th:attr="onclick=|if(confirm('Confirma exclusão da transação ${transacao.descricao}?')) window.location.href='@{/transacoes/delete/{id}(id=${transacao.id})}'|"
                  title="Excluir"
                >
                  <i class="fas fa-trash delete"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>

        <div
          th:if="${#lists.isEmpty(transacoes)}"
          class="alert alert-info text-center"
        >
          <i class="fas fa-info-circle"></i>
          Nenhuma transação encontrada para esta conta neste mês.
        </div>
      </div>

      <!-- Paginação -->
      <div
        th:if="${contaSelecionadaId != null and !#lists.isEmpty(transacoes)}"
        id="pagination-controls"
        class="estilo-row text-center mt-3"
      >
        <button id="prevPage" class="estilo-btn">Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="estilo-btn">Próximo</button>
      </div>

      <!-- Modal de transação -->
      <div
        class="modal fade"
        id="comentarioModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Comentário da Transação</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body" id="comentarioTexto">
              <!-- Texto do comentário entra aqui -->
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <th:block th:fragment="pageScripts">
      <script th:src="@{/js/listar.js}"></script>
    </th:block>
  </body>
</html>
