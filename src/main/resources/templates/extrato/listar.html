<!DOCTYPE html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/layout :: ~{}}"
>
  <th:block th:fragment="pageStyles">
    <link th:href="@{/css/listar.css}" rel="stylesheet" />
<!--    <link th:href="@{/css/formulario.css}" rel="stylesheet" />-->
  </th:block>

  <body>
    <div th:fragment="pageContent">
      <div
        class="header-table d-flex justify-content-between align-items-center mb-3"
      >
        <div class="container">

          <form th:action="@{/extrato}" method="post">
            <div class="row align-items-center justify-content-between p-0">
              <div class="col-4 dropdown-icon-wrapper">
                <select
                        class="form-select"
                        name="contaId"
                        id="contaId"
                >
                  <option value="">Selecione uma conta:</option>
                  <option
                          th:each="conta : ${contasCorrentista}"
                          th:value="${conta.id}"
                          th:selected="${conta.id == contaSelecionadaId}"
                          th:text="${conta.descricao}"
                  ></option>
                </select>
              </div>
              <div class="col-3 mb-3">
                <div class="input-group">
                  <span class="input-group-text">Data início</span>
                  <input class="form-control" type="date" id="dataInicio" name="dataInicio" th:value="${dataInicio}" />
                </div>
              </div>
              <div class="col-3 mb-3">
                <div class="input-group">
                  <span class="input-group-text">Data fim</span>
                  <input class="form-control" type="date" id="dataFim" name="dataFim" th:value="${dataFim}"/>
                </div>
              </div>
              <div class="col-1 mb-3"></div>
              <div class="col-1 mb-3">
                <button type="submit" id="btnFiltrar" class="btn btn-primary">
                  <span>Pesquisar</span>
                </button>
              </div>

            </div>
          </form>

        </div>

      </div>

      <!-- Mensagem quando nenhuma conta está selecionada -->
      <div th:if="${contaSelecionadaId == null}" class="alert alert-info mb-3">
        <i class="fas fa-info-circle"></i>
        Selecione uma conta acima para visualizar as transações.
      </div>

      <div
              th:if="${mensagem}"
              th:text="${mensagem}"
              class="text-danger text-center mb-3"
      ></div>
      <!-- Tabela só aparece se houver conta selecionada -->
      <div class="table-wrapper" th:if="${contaSelecionadaId != null}">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Valor (R$)</th>
              <th>Categoria</th>
              <th>Comentário</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="transacao : ${transacoes}">
              <td
                th:text="${#temporals.format(transacao.data, 'dd/MM/yyyy')}"
              ></td>

              <td th:text="${transacao.descricao}"></td>
              <td
                th:text="${#numbers.formatDecimal(transacao.valor, 1, 'COMMA', 2, 'POINT')}"
              ></td>
              <td th:text="${transacao.categoria.nome}"></td>
              <td
                th:text="${transacao.comentario != null ? transacao.comentario.texto : 'Sem comentário'}"
              ></td>
              <td class="actions">
                <a
                  th:href="@{/transacoes/editar/{id}(id=${transacao.id})}"
                  title="Editar"
                  ><i class="fas fa-edit edit"></i
                ></a>
                <a
                  th:href="@{/transacoes/comentario/{id}(id=${transacao.id})}"
                  title="Adicionar Comentário"
                >
                  <i class="fas fa-comment comment"></i>
                </a>

                <a
                  href="#"
                  th:attr="onclick=|if(confirm('Confirma exclusão da transação ${transacao.descricao}?')) window.location.href='@{/transacoes/delete/{id}(id=${transacao.id})}'|"
                  title="Excluir"
                  ><i class="fas fa-trash delete"></i
                ></a>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Mensagem quando conta está selecionada mas não há transações -->
        <div
          th:if="${#lists.isEmpty(transacoes)}"
          class="alert alert-info text-center"
        >
          <i class="fas fa-info-circle"></i>
          Nenhuma transação encontrada para esta conta neste mês.
        </div>
      </div>

      <!-- Controles de paginação só aparecem se houver transações -->
      <div
        th:if="${contaSelecionadaId != null and !#lists.isEmpty(transacoes)}"
        id="pagination-controls"
        style="margin-top: auto; text-align: center"
        class="estilo-row"
      >
        <button id="prevPage" class="estilo-btn">Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="estilo-btn">Próximo</button>
      </div>

      <div
        class="modal fade"
        id="modalCadastroTransacao"
        tabindex="-1"
        aria-hidden="true"
      ></div>
    </div>

    <th:block th:fragment="pageScripts">
      <script th:src="@{/js/listar.js}"></script>
    </th:block>
  </body>
</html>
