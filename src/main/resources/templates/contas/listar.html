<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>LumiCash - Contas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/main.css}" rel="stylesheet" />
    <link th:href="@{/css/sidenav.css}" rel="stylesheet" />
    <link th:href="@{/css/listConta.css}" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="container-fluid main-wrapper">
      <div id="sidenav-container" th:replace="fragments/sidenav :: sidenav"></div>

      <div class="col content-box">
        <div class="header-table d-flex justify-content-between align-items-center mb-3">
          <form class="d-flex" th:action="@{/contas/form}" method="get">
            <input
              class="search-input form-control"
              type="text"
              name="numero"
              placeholder="🔍  Procurar por conta..."
            />
          </form>

          <button
            class="cadastrar btn btn-primary"
            type="button"
            th:onclick="|window.location.href='@{/contas/form}'|"
          >
            + Cadastrar Conta
          </button>
        </div>

        <div th:text="${mensagem}" class="text-danger mb-3"></div>

        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>Número</th>
              <th>Descrição</th>
              <th>Tipo</th>
              <th style="text-align: center">Data de Abertura</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="conta : ${contas}">
              <td>
                <a th:href="@{/contas/{id}(id=${conta.id})}" th:text="${conta.numero}"></a>
              </td>
              <td th:text="${conta.descricao}"></td>
              <td th:text="${conta.tipo}"></td>
              <td th:text="${#dates.format(conta.data, 'dd/MM/yyyy')}" style="text-align: center"></td>
              <td class="actions">
                <a th:href="@{/contas/edit/{id}(id=${conta.id})}" title="Editar">
                  <i class="fas fa-edit edit"></i>
                </a>
                <a href="#" 
                   th:onclick="|if(confirm('Confirma exclusão da conta ${conta.numero}?')) window.location.href='@{/contas/delete/{id}(id=${conta.id})}';|"
                   title="Excluir">
                  <i class="fas fa-trash delete"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal com iframe para cadastro (opcional, pode ser removido se não usar modal) -->
    <div
      class="modal fade"
      id="modalCadastroConta"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cadastrar Conta</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body p-0" style="height: 600px">
            <iframe
              th:src="@{/contas/form}"
              width="100%"
              height="100%"
              style="border: none"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/home.js}"></script>
  </body>
</html>
