<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiCash - Cadastro de Conta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="../../static/css/main.css" />
    <link rel="stylesheet" href="../../static/css/formConta.css" />
    <link rel="stylesheet" href="../../static/css/sidenav.css" />
  </head>
  <body>
    <div class="container-fluid main-wrapper">
      <div id="sidenav-container"></div>
      <div class="col content-box">
        
        <div class="form-wrapper">
          <p class="mb-4">Cadastro de Conta</p>
          <form>
            <label class="form-label">Tipo</label>

            <div class="account-type-option selected">
              <img
                src="../../static/images/cartão.png"
                alt="Cartão de crédito"
              />
              Cartão de crédito
            </div>

            <div class="account-type-option">
              <img src="../../static/images/banco.png" alt="Conta corrente" />
              Conta corrente
            </div>

            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="name" />

            <label for="dia" class="form-label">Dia do fechamento</label>
            <div class="date-group">
              <select id="mes" name="mes">
                <option value="">MM</option>
                <!-- opções -->
              </select>
              <select id="ano" name="ano">
                <option value="">YYYY</option>
                <!-- opções -->
              </select>
            </div>
            <label for="Billing" class="form-label"> Billing Info</label>
            <br><br><br>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </form>
        </div>
      </div>
    </div>

    <script src="../../static/js/home.js"></script>
  </body>
</html>
