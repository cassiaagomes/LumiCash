<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiCash - Cadastro de Conta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/formConta.css}" />
    <link rel="stylesheet" th:href="@{/css/sidenav.css}" />
  </head>
  <body>
    <div class="container-fluid main-wrapper">
      <div
        id="sidenav-container"
        th:replace="fragments/sidenav :: sidenav"
      ></div>

      <div class="content-box">
        <div class="form-container">
          <h1>Cadastro de Conta</h1>

          <form th:action="@{/contas}" th:object="${conta}" method="POST">
            <div class="account-type-group">
              <label class="form-label">Tipo</label>

              <div
                class="account-type-option"
                th:classappend="${conta.tipo} == 'CARTAO' ? 'selected' : ''"
                th:onclick="|document.getElementById('tipoCartao').checked = true; this.classList.add('selected');|"
              >
                <img th:src="@{/images/cartão.png}" alt="Cartão de crédito" />
                Cartão de crédito
              </div>

              <div
                class="account-type-option"
                th:classappend="${conta.tipo} == 'CORRENTE' ? 'selected' : ''"
                th:onclick="|document.getElementById('tipoCorrente').checked = true; this.classList.add('selected');|"
              >
                <img th:src="@{/images/banco.png}" alt="Conta corrente" />
                Conta corrente
              </div>

              <input
                type="radio"
                id="tipoCartao"
                name="tipo"
                value="CARTAO"
                th:checked="${conta.tipo} == 'CARTAO'"
                hidden
              />
              <input
                type="radio"
                id="tipoCorrente"
                name="tipo"
                value="CORRENTE"
                th:checked="${conta.tipo} == 'CORRENTE'"
                hidden
              />
            </div>

            <label for="descricao" class="form-label">Descrição</label>
            <input
              type="text"
              id="descricao"
              th:field="*{descricao}"
              placeholder="Digite a descrição da conta"
              class="form-control"
            />

            <label for="diaFechamento" class="form-label">Dia do fechamento</label>
            <input
              type="number"
              id="diaFechamento"
              th:field="*{diaFechamento}"
              placeholder="Ex: 10"
              class="form-control"
              min="1"
              max="31"
            />

            <div class="billing-section">
              <label class="form-label">Billing Info</label>
              <!-- Se quiser adicionar mais campos, você pode colocar aqui -->
            </div>

            <button type="submit" class="btn btn-primary">
              Cadastrar Conta
            </button>
          </form>
        </div>
      </div>
    </div>

    <script th:src="@{/js/home.js}"></script>
    <script>
      document.querySelectorAll(".account-type-option").forEach((option) => {
        option.addEventListener("click", function () {
          document
            .querySelectorAll(".account-type-option")
            .forEach((opt) => opt.classList.remove("selected"));
          this.classList.add("selected");
        });
      });
    </script>
  </body>
</html>
