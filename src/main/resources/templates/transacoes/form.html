<!DOCTYPE html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/layout :: ~{}}"
>
  <body>
    <th:block th:fragment="pageStyles">
      <link rel="stylesheet" th:href="@{/css/home.css}" />
    </th:block>

    <th:block th:fragment="pageContent">
      <h1>Nova Transação</h1>

      <form
        th:action="@{|/contas/${contaId}/transacoes|}"
        method="POST"
        th:object="${transacao}"
      >
        <input type="hidden" th:field="*{id}" />

        <label for="data">Data</label>
        <input type="date" th:field="*{data}" /><br /><br />
        <span
          th:if="${#fields.hasErrors('data')}"
          th:errors="*{data}"
          class="error"
        ></span>

        <label for="descricao">Descrição</label>
        <input type="text" th:field="*{descricao}" /><br /><br />
        <span
          th:if="${#fields.hasErrors('descricao')}"
          th:errors="*{descricao}"
          class="error"
        ></span>

        <label for="valor">Valor</label>
        <input type="number" step="0.01" th:field="*{valor}" /><br /><br />
        <span
          th:if="${#fields.hasErrors('valor')}"
          th:errors="*{valor}"
          class="error"
        ></span>

        <label>Movimento</label><br />
        <input type="radio" th:field="*{movimento}" value="DEBITO" />
        Débito<br />
        <input type="radio" th:field="*{movimento}" value="CREDITO" />
        Crédito<br /><br />
        <span
          th:if="${#fields.hasErrors('movimento')}"
          th:errors="*{movimento}"
          class="error"
        ></span>

        <label for="categoriaId">Categoria</label>
        <select th:field="*{categoriaId}">
          <option value="" disabled selected>-- Selecione --</option>
          <option
            th:each="cat : ${categorias}"
            th:value="${cat.id}"
            th:text="${cat.nome}"
          ></option></select
        ><br /><br />
        <span
          th:if="${#fields.hasErrors('categoriaId')}"
          th:errors="*{categoriaId}"
          class="error"
        ></span>

        <hr />

        <button type="submit">Enviar</button>
        <a th:href="@{|/contas/${contaId}/extrato|}">Cancelar</a>
      </form>
    </th:block>
  </body>

  <th:block th:fragment="pageScripts"> </th:block>
</html>
