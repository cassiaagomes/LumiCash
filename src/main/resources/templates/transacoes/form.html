<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <th:block th:replace="~{layouts/layout :: ~{}}">
    <!-- Estilos -->
    <th:block th:fragment="pageStyles">
      <link rel="stylesheet" th:href="@{/css/formulariotran.css}" />
    </th:block>

    <!-- Conteúdo -->
    <th:block th:fragment="pageContent">
      <div class="form-container">
        <h1>Transação</h1>

        <!-- Seção de Contas -->
        <div class="accounts-section">
          <div
            class="account-card"
            th:each="conta : ${contas}"
            th:if="${conta.id == contaId}"
            th:classappend="'selected'"
          >
            <div class="account-info">
              <img
                class="account-icon"
                th:src="@{${conta.tipo == 'CARTAO' ? '/images/cartão.png' : '/images/banco.png'}}"
                th:alt="${conta.tipo == 'CARTAO' ? 'Cartão de Crédito' : 'Conta Corrente'}"
              />
              <div class="account-details">
                <h3
                  th:text="${conta.tipo == 'CARTAO' ? 'Cartão de Crédito' : 'Conta Corrente'}"
                ></h3>
                <p th:text="${conta.numero}">0000-0</p>
              </div>
            </div>
            <div class="check-icon">✓</div>
          </div>
        </div>

        <!-- Formulário -->
        <form
          id="formTransacao"
          th:action="@{/transacoes/salvar}"
          th:object="${transacao}"
          method="POST"
        >
          <!-- Valor e Movimento -->
          <div class="form-row">
            <div class="form-group">
              <label for="valor" class="form-label">Valor</label>
              <input
                type="number"
                id="valor"
                step="0.01"
                th:field="*{valor}"
                required
                placeholder="Valor"
                class="form-control"
              />
              <span
                th:if="${#fields.hasErrors('valor')}"
                th:errors="*{valor}"
                class="error"
              ></span>
            </div>

            <div class="form-group">
              <label class="form-label">Movimento</label>
              <div class="movement-buttons">
                <div
                  class="movement-btn"
                  th:classappend="${transacao.movimento == 'DEBITO'} ? 'selected' : ''"
                  onclick="selectMovement('debito', this)"
                >
                  Débito
                </div>
                <div
                  class="movement-btn"
                  th:classappend="${transacao.movimento == 'CREDITO'} ? 'selected' : ''"
                  onclick="selectMovement('credito', this)"
                >
                  Crédito
                </div>
              </div>
              <input
                type="radio"
                id="movDebito"
                name="movimento"
                value="DEBITO"
                th:field="*{movimento}"
              />
              <input
                type="radio"
                id="movCredito"
                name="movimento"
                value="CREDITO"
                th:field="*{movimento}"
              />

              <span
                th:if="${#fields.hasErrors('movimento')}"
                th:errors="*{movimento}"
                class="error"
              ></span>
            </div>
          </div>

          <!-- Categoria e Data -->
          <div class="form-row">
            <div class="form-group">
              <label for="categoria" class="form-label">Categoria</label>
              <select
                id="categoria"
                th:field="*{categoria.id}"
                class="form-control"
                required
              >
                <option value="" disabled>Selecione uma categoria</option>
                <option
                  th:each="cat : ${categorias}"
                  th:value="${cat.id}"
                  th:text="${cat.nome}"
                ></option>
              </select>
              <span
                th:if="${#fields.hasErrors('categoria')}"
                th:errors="*{categoria}"
                class="error"
              ></span>
            </div>

            <div class="form-group half">
              <label for="data" class="form-label">Data</label>
              <input
                type="date"
                id="data"
                th:field="*{data}"
                required
                class="form-control"
              />
              <span
                th:if="${#fields.hasErrors('data')}"
                th:errors="*{data}"
                class="error"
              ></span>
            </div>
          </div>

          <!-- Descrição -->
          <div class="form-group">
            <label for="descricao" class="form-label">Descrição</label>
            <input
              type="text"
              id="descricao"
              th:field="*{descricao}"
              required
              placeholder="Descreva sua transação"
              class="form-control"
            />
            <span
              th:if="${#fields.hasErrors('descricao')}"
              th:errors="*{descricao}"
              class="error"
            ></span>
          </div>

          <!-- Campo oculto para ID -->
          <input type="hidden" th:field="*{id}" />
          <input type="hidden" th:field="*{conta.id}" th:value="${contaId}" />

          <!-- Ações -->
          <div class="form-actions">
            <a
              th:href="@{|/transacoes?contaId=${contaId}|}"
              class="btn btn-secondary mt-3"
            >
              Cancelar
            </a>

            <button type="submit" class="action-button">
              Realizar transação <span class="arrow-icon">→</span>
            </button>
          </div>
        </form>
      </div>
    </th:block>

    <!-- Scripts -->
    <th:block th:fragment="pageScripts">
      <script th:src="@{/js/formtran.js}"></script>
    </th:block>
  </th:block>
</html>
