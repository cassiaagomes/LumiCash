<!DOCTYPE html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/layout :: ~{}}"
>
  <th:block th:fragment="pageStyles">
    <link th:href="@{/css/listar.css}" rel="stylesheet" />
  </th:block>

  <body>
    <div th:fragment="pageContent">
      <div
        class="header-table d-flex justify-content-between align-items-center mb-3"
      >
        <form class="d-flex" th:action="@{/correntistas}" method="get">
          <div class="input-icon-wrapper">
            <span class="input-icon"><i class="fa fa-search"></i></span>
            <input
              class="search-input form-control"
              type="text"
              name="number"
              placeholder="Procurar"
            />
          </div>
        </form>
        <button
          class="cadastrar btn btn-primary"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#modalCadastroCorrentista"
        >
          + Cadastrar Correntista
        </button>
      </div>

      <div class="table-wrapper">
        <div
          th:if="${mensagem}"
          th:text="${mensagem}"
          class="alert alert-success mb-3"
        ></div>

        <div
          th:if="${erro}"
          th:text="${erro}"
          class="alert alert-danger mb-3"
        ></div>

        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>Id</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Tipo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="correntista : ${correntistas}">
              <td th:text="${correntista.id}"></td>
              <td th:text="${correntista.nome}"></td>
              <td th:text="${correntista.email}"></td>
              <td
                th:text="${correntista.isAdmin ? 'Administrador' : 'Usuário'}"
              ></td>
              <td class="actions">
                <a
                  th:href="@{/correntistas/edit/{id}(id=${correntista.id})}"
                  title="Editar"
                  ><i class="fas fa-edit edit"></i
                ></a>

                <a
                  href="#"
                  title="Bloquear"
                  th:onclick="|bloquearCorrentista('@{/correntistas/bloquear/{id}(id=${correntista.id})}'); return false;|"
                >
                  <i class="fas fa-ban block"></i>
                </a>

                <a
                  href="#"
                  title="Apagar"
                  th:onclick="|deletarCorrentista('@{/correntistas/delete/{id}(id=${correntista.id})}'); return false;|"
                >
                  <i class="fas fa-trash delete"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div
        id="pagination-controls"
        style="margin-top: auto; text-align: center"
        class="estilo-row"
      >
        <button id="prevPage" class="estilo-btn">Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="estilo-btn">Próximo</button>
      </div>

      <div
        class="modal fade"
        id="modalCadastro"
        tabindex="-1"
        aria-hidden="true"
      ></div>
    </div>

    <div
      class="modal fade"
      id="modalCadastroCorrentista"
      tabindex="-1"
      aria-labelledby="modalCadastroLabel"
      aria-hidden="true"
    >

    <!-- Modal abaixo -->
      <div class="modal-dialog">
        <div class="modal-content">
          <form
            th:action="@{/correntistas}"
            method="POST"
            th:object="${correntista}"
          >
            <div class="modal-header">
              <h5 class="modal-title" id="modalCadastroLabel">
                Cadastro de Correntista
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>

            <div class="modal-body">
              <input type="hidden" th:field="*{id}" />

              <div class="mb-3">
                <label class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{nome}"
                  required
                />
                <div
                  class="text-danger"
                  th:if="${#fields.hasErrors('nome')}"
                  th:errors="*{nome}"
                ></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  th:field="*{email}"
                  required
                />
                <div
                  class="text-danger"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                ></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  th:field="*{senha}"
                  required
                />
                <div
                  class="text-danger"
                  th:if="${#fields.hasErrors('senha')}"
                  th:errors="*{senha}"
                ></div>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  th:field="*{isAdmin}"
                  id="adminCheck"
                />
                <label class="form-check-label" for="adminCheck"
                  >Usuário Administrador</label
                >
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <th:block th:fragment="pageScripts">
      <script th:src="@{/js/listar.js}"></script>
    </th:block>
  </body>
</html>
