<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>LumiCash - Correntistas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/main.css}" rel="stylesheet" />
    <link th:href="@{/css/sidenav.css}" rel="stylesheet" />
    <link th:href="@{/css/listCorrentistas.css}" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container-fluid main-wrapper">
      <div
        id="sidenav-container"
        th:replace="fragments/sidenav :: sidenav"
      ></div>

      <div class="col content-box">
        <div
          class="header-table d-flex justify-content-between align-items-center mb-3"
        >
          <form class="d-flex" th:action="@{/correntistas}" method="get">
            <input
              class="search-input form-control"
              type="text"
              name="number"
              placeholder="🔍  Procurar por correntista..."
            />
          </form>

          <button
            class="cadastrar btn btn-primary"
            type="button"
            th:onclick="|window.location.href='@{/correntistas/form}'|"
          >
            + Cadastrar Correntista
          </button>
        </div>

        <div th:text="${mensagem}" class="text-danger mb-3"></div>

        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Tipo</th>
              <th>Senha</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="correntista : ${correntistas}">
              <td th:text="${correntista.id}"></td>
              <td th:text="${correntista.nome}"></td>
              <td th:text="${correntista.email}"></td>
              <td
                th:text="${correntista.isAdmin ? 'Administrador' : 'Usuário'}"
              ></td>
              <td
                th:text="${#strings.substring(correntista.senha,0,3) + '...'}"
              ></td>
              <td class="actions">
                <a
                  th:href="@{/correntistas/edit/{id}(id=${correntista.id})}"
                  title="Editar"
                >
                  <i class="fas fa-edit edit"></i>
                </a>
                <!--/*
                <a
                  href="#"
                  th:onclick="|if(confirm('Confirma exclusão do correntista ${correntista.nome}?')) window.location.href='@{/correntistas/delete/{id}(id=${correntista.id})}';|"
                  title="Excluir"
                >
                  <i class="fas fa-trash delete"></i>
                </a>
                */-->
                <a
                  href="#"
                  title="Bloquear"
                  th:onclick="|alert('Funcionalidade de bloqueio não implementada ainda!');|"
                >
                  <i class="fas fa-ban block"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal com iframe para cadastro -->
    <div class="modal fade" id="modalCadastro" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cadastrar Correntista</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body p-0" style="height: 600px">
            <iframe
              th:src="@{/correntistas/form}"
              width="100%"
              height="100%"
              style="border: none"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/home.js}"></script>
  </body>
</html>
