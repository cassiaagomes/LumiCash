<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>LumiCash - Cadastro de Correntistas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/formCorrentistas.css}" />
    <link rel="stylesheet" th:href="@{/css/sidenav.css}" />
  </head>
  <body>
    <div class="container-fluid main-wrapper">
      <div th:replace="fragments/sidenav :: sidenav"></div>

      <div class="content-box">
        <div class="form-container">
          <h1>Cadastro de Correntista</h1>

          <!-- <div th:text="${mensagem}" class="alert alert-danger" th:if="${mensagem}"></div> -->

          <form
            th:action="@{/correntistas}"
            method="POST"
            th:object="${correntista}"
          >
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input
                type="text"
                class="form-control"
                th:field="*{nome}"
                placeholder="Digite o nome completo"
              />
              <div
                class="text-danger"
                th:if="${#fields.hasErrors('nome')}"
                th:errors="*{nome}"
              ></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                th:field="*{senha}"
                placeholder="Digite a senha"
              />
              <div
                class="text-danger"
                th:if="${#fields.hasErrors('senha')}"
                th:errors="*{senha}"
              ></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                th:field="*{email}"
                placeholder="Digite o e-mail"
              />
              <div
                class="text-danger"
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}"
              ></div>
            </div>

            <div class="form-check mb-4">
              <input
                class="form-check-input"
                type="checkbox"
                th:field="*{isAdmin}"
                id="adminCheck"
              />
              <label class="form-check-label" for="adminCheck"
                >Usuário Administrador</label
              >
            </div>

            <button type="submit" class="btn btn-primary">
              Cadastrar Correntista
            </button>
          </form>
        </div>
      </div>
    </div>

    <script th:src="@{/js/home.js}"></script>
  </body>
</html>
