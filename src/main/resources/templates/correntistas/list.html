<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>LumiCash - Correntistas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/main.css" />
    <link rel="stylesheet" href="../../static/css/sidenav.css" />
    <link rel="stylesheet" href="../../static/css/listCorrentistas.css" />
    <style></style>
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container-fluid main-wrapper">
      <!-- Aqui o sidenav será injetado -->
      <div id="sidenav-container"></div>

      <!-- Conteúdo principal -->
      <div class="col content-box">
        <div class="header-table">
          <form class="d-flex" action="/search" method="get">
            <input
              class="search-input"
              type="text"
              name="number"
              placeholder="🔍 Procurar por conta..."
            />
          </form>
          <button
            class="cadastrar btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalCadastro"
          >
            + Cadastrar Usuário
          </button>
        </div>

        <div th:text="${mensagem}" class="text-danger mb-3"></div>

        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Tipo</th>
              <th>Senha</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="correntista : ${correntistas}">
              <td th:text="${correntista.id}"></td>
              <td th:text="${correntista.nome}"></td>
              <td th:text="${correntista.email}"></td>
              <td th:text="${correntista.admin ? 'Admin' : 'Correntista'}"></td>
              <td
                th:text="${#strings.substring(correntista.senha,0,3) + '...'}"
              ></td>
              <td class="actions">
                <i class="fas fa-edit edit" title="Editar"></i>
                <i class="fas fa-trash delete" title="Excluir"></i>
                <i class="fas fa-ban block" title="Bloquear"></i>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal com iframe -->
    <div class="modal fade" id="modalCadastro" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cadastrar Correntista</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body p-0" style="height: 600px">
            <iframe
              src="../correntistas/form.html"
              width="100%"
              height="100%"
              style="border: none"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Injetando o sidenav dinamicamente -->
    <script src="../../static/js/home.js"></script>
    <script src="../../static/js/modal.js"></script>
  </body>
</html>
